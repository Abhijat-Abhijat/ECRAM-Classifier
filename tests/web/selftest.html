<!doctype html>
<html><head><meta charset="utf-8"><title>browser parity self-test</title></head>
<body>
<pre id="log">starting…</pre>
<!-- The real app, loaded unmodified -->
<iframe id="app" src="/web/index.html" style="width:400px;height:300px"></iframe>
<script>
(async () => {
  const log = (m) => (document.getElementById("log").textContent += "\n" + m);
  const frame = document.getElementById("app");
  await new Promise((r) => frame.addEventListener("load", r, { once: true }));
  const app = frame.contentWindow.CellApp, imaging = frame.contentWindow.CellImaging;
  await app.ready;
  const cases = await (await fetch("/__cases")).json();
  const b64 = (u8) => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
  for (const c of cases) {
    const res = { id: c.id };
    try {
      // one retry: the tiny test server can drop a connection under heavy load
      const get = async () => { const r = await fetch(c.url); if (!r.ok) throw new Error("HTTP " + r.status); return r.blob(); };
      const blob = await get().catch(get);
      const file = new File([blob], c.name, { type: blob.type });
      const t0 = performance.now();
      const input = await imaging.toModelInput(file);
      res.read_ms = Math.round(performance.now() - t0);
      res.pixels = b64(input.pixels);
      res.kind = input.kind;
      if (c.predict) {
        const d = await app.predict(file);
        res.prob = d.raw; res.total_ms = d.processing_ms;
      }
    } catch (e) { res.error = String(e && e.message || e); }
    await fetch("/__result", { method: "POST", body: JSON.stringify(res) });
    log(`${c.id} ${res.error ? "ERROR " + res.error : "ok"}`);
  }
  await fetch("/__done", { method: "POST", body: "{}" });
  log("done");
})().catch(async (e) => { await fetch("/__done", { method: "POST", body: JSON.stringify({ fatal: String(e) }) }); });
</script>
</body></html>
